<title>SCHWARZB(r)OT — local AI</title>
<style>
  :root{
    --bg:#1b1c1e;
    --app:#0f0e0b;
    --header:#202123;
    --bubble-bot:#25231d;
    --bubble-user:#232529;
    --line:#34332c;
    --line-cool:#333539;
    --line-soft:#232219;
    --text:#ece7db;
    --strong:#f7f0e2;
    --muted:#9c9484;
    --faint:#6b6559;
    --amber:#e0982a;
    --amber-bright:#f2b455;
    --cream:#e8ddc4;
    --good:#86bd6d;
    --warn:#d4674a;
    --sans:system-ui,"Segoe UI","Noto Sans",Roboto,Helvetica,Arial,sans-serif;
    --mono:"JetBrains Mono","SF Mono","Fira Code",ui-monospace,"Consolas",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--sans);color:var(--text);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;padding:min(4vh,30px) 16px;
  }
  .app{
    width:100%;max-width:860px;height:calc(100vh - min(8vh,60px));
    display:flex;flex-direction:column;
    background:var(--app);
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 34px 90px -34px rgba(0,0,0,.85);
    animation:rise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  header{
    display:flex;align-items:center;gap:22px;
    padding:20px 24px;
    background:
      radial-gradient(90% 200% at 20% -40%, rgba(231,163,46,.17), transparent 60%),
      linear-gradient(180deg,#3c2d12,#261e0c);
    border-bottom:1px solid #40311a;
  }
  header .tagline{color:#cebe9b}
  header .pill{color:#cebe9b}
  header .model{color:#a68f68}
  header .model b{color:#ddc89d}
  header .iconbtn{border-color:#5b4821;color:#cebe9b;background:rgba(255,255,255,.05)}
  header .iconbtn:hover{color:#fff;border-color:var(--amber-bright);background:rgba(255,255,255,.12)}
  .logo-tile{
    flex:0 0 auto;
    background:radial-gradient(130% 130% at 30% 15%,#f4ead2,var(--cream));
    border-radius:22px;padding:14px 20px;
    box-shadow:0 6px 20px -6px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.12) inset;
    display:flex;align-items:center;justify-content:center;
  }
  .logo-tile img{height:76px;width:auto;display:block}
  .brand-text{display:flex;flex-direction:column;gap:7px;min-width:0}
  .wordmark{
    font-weight:700;letter-spacing:.03em;font-size:29px;line-height:1.2;
    color:#f2ead9;
    font-family:"Noto Sans","DejaVu Sans","Segoe UI",sans-serif;
  }
  .wordmark .r{
    color:var(--amber);font-weight:700;text-transform:lowercase;
    letter-spacing:0;font-size:.72em;vertical-align:.04em;
  }
  .tagline{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.01em}
  .statusline{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;
    font-family:var(--mono);font-size:11.5px;margin-top:1px;
  }
  .pill{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good);
    box-shadow:0 0 0 3px rgba(134,189,109,.15)}
  /* still loading the model: a slow pulsing red, so it reads as "busy", not "broken" */
  .dot.starting{background:var(--warn);box-shadow:0 0 0 3px rgba(212,103,74,.18);
    animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .model{color:var(--faint)}
  .model b{color:var(--muted);font-weight:600}
  /* shown only while the engine is still loading the model */
  .startnote{
    font-family:var(--mono);font-size:11px;line-height:1.5;
    color:var(--faint);margin-top:7px;max-width:56ch;
  }
  .spacer{flex:1 1 auto}
  .iconbtn{
    align-self:flex-start;width:38px;height:38px;flex:0 0 auto;border-radius:10px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;
  }
  .iconbtn:hover{color:var(--text);border-color:var(--amber);background:rgba(224,152,42,.08)}
  .iconbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  main{flex:1 1 auto;overflow-y:auto;padding:28px 20px 10px}
  .thread{display:flex;flex-direction:column;gap:24px;max-width:700px;margin:0 auto}
  .msg{display:flex;align-items:flex-start;gap:14px;animation:fade .4s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .avatar{
    height:64px;flex:0 0 auto;border-radius:16px;
    background:radial-gradient(130% 130% at 30% 15%,#f4ead2,var(--cream));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,.45);padding:9px 12px;
  }
  .avatar img{height:100%;width:auto;display:block}
  .bubble{
    padding:13px 16px;border-radius:15px;font-size:15px;line-height:1.58;
    border:1px solid var(--line-soft);min-width:0;
  }
  .bot .bubble{background:var(--bubble-bot);border-color:#332f26;border-top-left-radius:5px}
  .bot .bubble strong{color:var(--strong);font-weight:600}
  .user{justify-content:flex-end}
  .user .bubble{background:var(--bubble-user);border-color:var(--line-cool);border-top-right-radius:5px;max-width:80%}
  .who{font-family:var(--mono);font-size:11px;color:var(--faint);margin:0 0 6px;letter-spacing:.03em}
  .body{word-wrap:break-word;overflow-wrap:break-word}
  .body code{font-family:var(--mono);font-size:.9em;background:rgba(0,0,0,.32);padding:1px 5px;border-radius:5px}
  .body pre{font-family:var(--mono);font-size:12.5px;line-height:1.5;background:rgba(0,0,0,.35);
    padding:10px 12px;border-radius:8px;overflow-x:auto;margin:8px 0;white-space:pre}
  .body.err{color:#e8b98a}
  .typing{display:inline-flex;gap:5px;align-items:center;padding:4px 0}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .thought{margin:0 0 9px}
  .thought summary{
    display:inline-flex;align-items:center;gap:7px;cursor:pointer;list-style:none;
    font-family:var(--mono);font-size:11.5px;color:var(--faint);
    padding:4px 10px;border:1px solid #302d24;border-radius:999px;transition:.15s;user-select:none;
  }
  .thought summary::-webkit-details-marker{display:none}
  .thought summary:hover{color:var(--muted);border-color:var(--line)}
  .thought[open] summary{color:var(--muted)}
  .thought .diamond{color:var(--amber)}
  .thought .reason{
    margin-top:9px;padding:12px 14px;border-left:2px solid var(--amber);
    background:rgba(0,0,0,.3);border-radius:0 8px 8px 0;
    font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--muted);white-space:pre-wrap}

  footer{padding:14px 20px 18px;border-top:1px solid var(--line-soft)}
  .composer{
    max-width:700px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;
    background:var(--bubble-bot);border:1px solid var(--line);border-radius:15px;
    padding:8px 8px 8px 16px;transition:.18s;
  }
  .composer:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px rgba(224,152,42,.13)}
  .composer .field{
    flex:1 1 auto;min-height:26px;max-height:140px;overflow-y:auto;
    color:var(--text);font-size:15px;line-height:1.5;padding:5px 0;outline:none;
  }
  .composer .field:empty::before{content:attr(data-ph);color:var(--faint)}
  .send{
    width:38px;height:38px;flex:0 0 auto;border:none;border-radius:11px;cursor:pointer;
    background:linear-gradient(180deg,var(--amber-bright),var(--amber));color:#231902;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px -3px rgba(224,152,42,.6);transition:.15s;
  }
  .send:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .send:disabled{opacity:.5;cursor:default;transform:none;filter:none}
  /* while a reply streams, the send button becomes a stop button */
  .send.stopping{
    background:linear-gradient(180deg,#3c3a33,#2c2b26);color:var(--cream);
    box-shadow:0 2px 10px -4px rgba(0,0,0,.6);
  }
  .send:focus-visible{outline:2px solid var(--amber-bright);outline-offset:2px}
  .footnote{
    max-width:700px;margin:10px auto 0;text-align:center;
    font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.02em;
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .footnote .lock{color:var(--good)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:600px){
    body{padding:0}
    .app{height:100vh;border-radius:0;border:none;max-width:none}
    header{flex-wrap:wrap;gap:16px;padding:18px}
    .logo-tile img{height:58px}
    .iconbtn{position:absolute;top:18px;right:18px}
  }
</style>

  <main id="main">
    <div class="thread" id="thread"></div>
  </main>

  <footer>
    <div class="composer">
      <div class="field" id="field" contenteditable="true" role="textbox" aria-label="Message SCHWARZBrOT" data-ph="Ask SCHWARZBrOT&hellip;"></div>
      <button class="send" id="send" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="footnote"><span class="lock">&#9679;</span> runs locally on SCHWARZPAUSE &middot; nothing leaves this machine</div>
  </footer>
</div>

<script>
(function(){
  var LOGO = document.querySelector('.logo-tile img').getAttribute('src');
  var SYSTEM = "You are SCHWARZBrOT, a helpful offline AI.";

  var thread = document.getElementById('thread');
  var mainEl = document.getElementById('main');
  var field  = document.getElementById('field');
  var sendBtn= document.getElementById('send');
  var history = [];
  var busy = false;

  // While a reply is streaming the send button turns into a stop button; clicking
  // it calls whatever stopper the in-flight request registered here.
  var stopCurrent = null;
  var ICON_SEND = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  var ICON_STOP = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  function setSendMode(streaming){
    sendBtn.innerHTML = streaming ? ICON_STOP : ICON_SEND;
    sendBtn.setAttribute('aria-label', streaming ? 'Stop generating' : 'Send message');
    sendBtn.setAttribute('title', streaming ? 'Stop' : 'Send');
    if(streaming) sendBtn.classList.add('stopping');
    else sendBtn.classList.remove('stopping');
  }

  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function fmt(s){
    var h = esc(s);
    h = h.replace(/```([\s\S]*?)```/g, function(m,c){ return '<pre>'+c.replace(/^\n/,'')+'</pre>'; });
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/\n/g, '<br>');
    return h;
  }
  function scrollDown(){ mainEl.scrollTop = mainEl.scrollHeight; }

  function addUser(text){
    var row = document.createElement('div'); row.className = 'msg user';
    row.innerHTML = '<div class="bubble"><div class="who">you</div><div class="body">'+fmt(text)+'</div></div>';
    thread.appendChild(row); scrollDown();
  }
  function addBotRow(){
    var row = document.createElement('div'); row.className = 'msg bot';
    row.innerHTML = '<div class="avatar"><img src="'+LOGO+'" alt=""></div>'
      + '<div class="bubble"><div class="who">schwarzbrot</div>'
      + '<div class="body"><span class="typing"><span></span><span></span><span></span></span></div></div>';
    thread.appendChild(row); scrollDown();
    return row;
  }
  function botError(row, msg){
    row.querySelector('.bubble').innerHTML =
      '<div class="who">schwarzbrot</div><div class="body err">&#9888; I couldn\'t reach the model. '
      + 'Make sure <code>llama-server</code> is running and serving this page.'
      + '<br><span style="opacity:.7">('+esc(msg)+')</span></div>';
    scrollDown();
  }
  function welcome(){
    var row = document.createElement('div'); row.className = 'msg bot';
    row.innerHTML = '<div class="avatar"><img src="'+LOGO+'" alt=""></div>'
      + '<div class="bubble"><div class="who">schwarzbrot</div><div class="body">'
      + 'Hallo! I\'m <strong>SCHWARZBrOT</strong>, your local loaf of intelligence. '
      + 'Ask me anything &mdash; nothing you type ever leaves this machine.</div></div>';
    thread.appendChild(row);
  }

  function send(){
    if(busy || !ready) return;
    var text = (field.innerText || '').trim();
    if(!text) return;
    field.innerHTML = '';
    busy = true; setSendMode(true);   // stays enabled — it is the stop button now
    addUser(text);
    history.push({ role:'user', content:text });

    var row = addBotRow();
    var bubble = row.querySelector('.bubble');
    var t0 = Date.now();
    var acc = '', reason = '', done = false, started = false;
    var stopped = false, finalized = false, abortCtl = null;
    var buffer = '';

    function render(){
      var html = '<div class="who">schwarzbrot</div>';
      if(reason){
        var label = done ? ('thought for '+((Date.now()-t0)/1000).toFixed(1)+'s') : 'thinking&hellip;';
        html += '<details class="thought"'+(done?'':' open')+'><summary><span class="diamond">&#9671;</span> '
              + label+'</summary><div class="reason">'+esc(reason)+'</div></details>';
      }
      var bodyHtml = acc ? fmt(acc)
        : (started ? '' : '<span class="typing"><span></span><span></span><span></span></span>');
      html += '<div class="body">'+bodyHtml+'</div>';
      bubble.innerHTML = html; scrollDown();
    }
    function splitThink(){
      var m = acc.match(/<think>([\s\S]*?)<\/think>/i);
      if(m){ reason += (reason?'\n':'') + m[1].trim(); acc = acc.replace(m[0],'').replace(/^\s+/,''); }
    }
    function delta(d){
      if(d.reasoning_content){ reason += d.reasoning_content; started = true; }
      if(d.content){ acc += d.content; started = true; }
      if(acc.indexOf('</think>') >= 0) splitThink();
      render();
    }
    function handleLine(line){
      if(stopped) return;
      if(line.charAt(line.length-1) === '\r') line = line.slice(0,-1);
      if(line.indexOf('data: ') !== 0) return;
      var p = line.substring(6);
      if(p === '[DONE]'){ done = true; return; }
      try{ var j = JSON.parse(p); delta((j.choices&&j.choices[0]&&j.choices[0].delta)||{}); }catch(e){}
    }
    function finish(){ busy = false; stopCurrent = null; setSendMode(false); field.focus(); }
    function finalize(){
      if(finalized) return;   // stop + stream-end can both land here
      finalized = true;
      done = true;
      if(!acc && !reason) acc = '(no answer returned)';
      history.push({ role:'assistant', content:acc });
      render(); finish();
    }

    // The system prompt was dropped while we developed in the no-AVX VM, where
    // even a few extra tokens took ~90 s to process and the browser gave up. On
    // real AVX2 hardware prompt processing runs at ~147 tok/s, so it costs well
    // under a tenth of a second -- send it.
    var payloadMsgs = [{ role:'system', content: SYSTEM }].concat(history);
    var _li = payloadMsgs.length - 1;
    if(payloadMsgs[_li] && payloadMsgs[_li].role === 'user'){
      payloadMsgs[_li] = { role:'user', content: payloadMsgs[_li].content + ' /no_think' };
    }

    // Stream with fetch + ReadableStream reader (the method llama.cpp's built-in UI
    // uses; WebPositive delivers it incrementally, so no browser timeout).
    abortCtl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    stopCurrent = function(){
      if(stopped) return;
      stopped = true;
      if(abortCtl){ try{ abortCtl.abort(); }catch(e){} return; }
      // No AbortController in this browser: stop rendering what still arrives and
      // keep whatever was generated so far.
      if(!acc && !reason) acc = '(stopped)';
      finalize();
    };

    var opts = {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        messages: payloadMsgs,
        stream: true, temperature: 0.7, cache_prompt: true,
        chat_template_kwargs: { enable_thinking: false }
      })
    };
    if(abortCtl) opts.signal = abortCtl.signal;

    fetch('/v1/chat/completions', opts).then(function(res){
      if(!res.ok) throw new Error('HTTP '+res.status);
      if(!res.body || !res.body.getReader){
        return res.text().then(function(t){
          var lines = t.split('\n'), any = false;
          for(var k=0;k<lines.length;k++){ if(lines[k].indexOf('data: ')===0){ any=true; handleLine(lines[k]); } }
          if(!any){ try{ var j=JSON.parse(t); var m=(j.choices&&j.choices[0]&&j.choices[0].message)||{};
            acc=m.content||''; if(m.reasoning_content) reason=m.reasoning_content;
            if(acc.indexOf('</think>')>=0) splitThink(); }catch(e){} }
          finalize();
        });
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      function drain(){
        return reader.read().then(function(r){
          if(r.done){ if(buffer) handleLine(buffer); finalize(); return; }
          buffer += decoder.decode(r.value, { stream:true });
          var idx;
          while((idx = buffer.indexOf('\n')) >= 0){
            var line = buffer.substring(0, idx); buffer = buffer.substring(idx+1);
            handleLine(line);
          }
          return drain();
        });
      }
      return drain();
    }).catch(function(e){
      // Pressing stop aborts the fetch — that is not an error: keep the partial answer.
      if(stopped || (e && e.name === 'AbortError')){
        if(!acc && !reason) acc = '(stopped)';
        finalize();
        return;
      }
      history.pop(); botError(row, (e&&e.message)?e.message:String(e)); finish();
    });
  }

  field.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', function(){
    if(busy){ if(stopCurrent) stopCurrent(); return; }
    send();
  });
  document.getElementById('newchat').addEventListener('click', function(){
    history = []; thread.innerHTML = ''; welcome(); field.focus();
  });

  // The engine serves this page as soon as it starts, but answers /health with 503
  // until the model is fully loaded — minutes when reading ~3 GB off a USB stick.
  // So the window opens immediately and reports progress here, rather than the
  // launcher holding it back and looking like nothing happened at all.
  var statusDot = document.getElementById('statusdot');
  var statusText = document.getElementById('statustext');
  var startNote = document.getElementById('startnote');
  var ready = false;

  function setReady(){
    if(ready) return;
    ready = true;
    statusDot.className = 'dot';
    statusText.innerHTML = 'local &middot; offline';
    if(startNote) startNote.style.display = 'none';
    field.setAttribute('contenteditable', 'true');
    field.setAttribute('data-ph', 'Ask SCHWARZBrOT…');
    sendBtn.disabled = false;
    fetch('/v1/models').then(function(r){ return r.json(); }).then(function(d){
      var id = d && d.data && d.data[0] && d.data[0].id;
      document.getElementById('modelname').textContent =
        id ? String(id).replace(/^.*[\\/]/, '') : 'local model';
    }).catch(function(){
      document.getElementById('modelname').textContent = 'local model';
    });
    field.focus();
  }

  function probe(){
    fetch('/health', { cache:'no-store' }).then(function(r){
      if(r.ok) return setReady();
      // 503 = still loading. 404 = this build has no /health, so fall back to the
      // models endpoint, which only answers once the model is actually live.
      if(r.status === 404){
        return fetch('/v1/models').then(function(m){
          if(m.ok) setReady(); else setTimeout(probe, 2000);
        }).catch(function(){ setTimeout(probe, 2000); });
      }
      setTimeout(probe, 2000);
    }).catch(function(){ setTimeout(probe, 2000); });
  }

  // Hold the composer closed until the model is live, so a message cannot fail.
  field.setAttribute('contenteditable', 'false');
  field.setAttribute('data-ph', 'Starting the AI engine…');
  sendBtn.disabled = true;

  welcome();
  probe();
})();
</script>
